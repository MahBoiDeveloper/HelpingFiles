// Default binds
unbind mouse1     ; bind mouse1     +attack;
unbind mouse2     ; bind mouse2     +attack2;
unbind space      ; bind space      +jump;
unbind alt        ; bind alt        +lookatweapon;
unbind f          ; bind f          +voicerecord;
unbind z          ; bind z          slot6;
unbind x          ; bind x          slot7;
unbind c          ; bind c          slot8;
unbind v          ; bind v          slot10;
unbind backspace  ; bind backspace  messagemode2;
unbind enter      ; bind enter      messagemode;
unbind y          ; bind y          radio1;
unbind u          ; bind u          radio2;
unbind i          ; bind i          radio3;
unbind mwheelup   ; bind mwheelup   +jump;
unbind mwheeldown ; bind mwheeldown +jump;

// Radar
cl_radar_scale 0.4;
cl_hud_radar_scale 1.2;
cl_radar_always_centered false;

// Misc
snd_mixahead 0.001
engine_low_latency_sleep_after_client_tick 1;
cl_teamid_overhead_mode 3;
cl_obs_interp_enable 0;
cl_hud_telemetry_frametime_show 2;
fps_max 0;
fps_max_ui 0;
view_punch_decay 999;

// Unknown magic
violence_hblood 0;

echo "YIPPEE";
