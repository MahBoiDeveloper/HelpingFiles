// Default binds
bind mouse1 +attack;
bind mouse2 +attack2;
bind space "+jump";
bind alt +lookatweapon;
bind f +voicerecord;
bind z "slot6";
bind x "slot7";
bind c "slot8";
bind v "slot10";
bind backspace "messagemode2";
bind enter "messagemode";

// Radar
cl_radar_scale 0.4
cl_hud_radar_scale 1.2
cl_radar_always_centered false

// Misc
snd_mixahead 0.001
engine_low_latency_sleep_after_client_tick 1
cl_teamid_overhead_mode 3
cl_obs_interp_enable 0
cl_hud_telemetry_frametime_show 2
fps_max 0
fps_max_ui 0
view_punch_decay 999

// Unknown magic
violence_hblood 0

echo "YIPPEE";
