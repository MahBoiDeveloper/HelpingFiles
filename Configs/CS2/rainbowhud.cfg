// crosshair color doesn't correspond with ui color

alias changeColor "incrementvar cl_hud_color 0 13 1; incrementvar cl_crosshaircolor 0 13 1";

alias colorsToggle "colorsOn";

alias +cW     "+forward; changeColor;";
alias -cW     "-forward; changeColor;";
alias +cS     "+back;    changeColor;";
alias -cS     "-back;    changeColor;";
alias +cA     "+left;    changeColor;";
alias -cA     "-left;    changeColor;";
alias +cD     "+right;   changeColor;";
alias -cD     "-right;   changeColor;";
alias +cCtrl  "+duck;    changeColor;";
alias -cCtrl  "-duck;    changeColor;";
alias +cSpace "+jump;    changeColor;";
alias -cSpace "-jump;    changeColor;";
alias +cR     "+reload;  changeColor;";
alias -cR     "-reload;  changeColor;";
alias +cE     "+use;     changeColor;";
alias -cE     "-use;     changeColor;";
alias cQ      "lastinv;  changeColor;";
alias cG      "drop;     changeColor;";
alias cB      "buymenu;  changeColor;";
alias +cLMB   "+attack;  changeColor;";
alias -cLMB   "-attack;  changeColor;";
alias +cRMB   "+attack2; changeColor;";
alias -cRMB   "-attack2; changeColor;";
alias c1      "slot1;    changeColor;";
alias c2      "slot2;    changeColor;";
alias c3      "slot3;    changeColor;";
alias c4      "slot4;    changeColor;";
alias c5      "slot5;    changeColor;";
alias c6      "slot6;    changeColor;";
alias c7      "slot7;    changeColor;";
alias c8      "slot8;    changeColor;";
alias c9      "slot9;    changeColor;";
alias c0      "slot0;    changeColor;";

alias colorsBind   "bind w +cW;      bind a +cA;   bind s +cS;   bind d +cD;    bind ctrl +cCtrl; bind space +cSpace; bind mouse1 +cLMB;   bind mouse2 +cRMB;    bind e +cE;  bind r +cR;     bind q cQ;      bind g cG;   bind b cB;      bind 1 c1;    bind 2 c2;    bind 3 c3;    bind 4 c4;    bind 5 c5;    bind 6 c6;    bind 7 c7;    bind 8 c8;    bind 9 c9;    bind 0 c0;";
alias colorsUnbind "bind w +forward; bind a +left; bind s +back; bind d +right; bind ctrl +duck;  bind space +jump;   bind mouse1 +attack; bind mouse2 +attack2; bind e +use; bind r +reload; bind q lastinv; bind g drop; bind b buymenu; bind 1 slot1; bind 2 slot2; bind 3 slot3; bind 4 slot4; bind 5 slot5; bind 6 slot6; bind 7 slot7; bind 8 slot8; bind 9 slot9; bind 0 slot0;";

alias colorsOn  "alias colorsToggle colorsOff; colorsBind;";
alias colorsOff "alias colorsToggle colorsOn;  colorsUnbind; cl_hud_color 4; cl_crosshaircolor 4;";

// Bind K as feature on/off
bind k "colorsToggle";

echo "Use K to enable Rainbow HUD config"
